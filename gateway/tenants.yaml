# Who may use the gateway. The Tenant-ID header must match one of these names.
#   allowed_models: model names (from config.yaml) this tenant may request
#   tpm_quota:      tokens per minute; not enforced yet (later task)
#   pii_scrubbing:  optional, default true. Set to false to send prompts unredacted.
tenants:
  support:
    allowed_models: [claude-sonnet-5-5]
    tpm_quota: 50000
  engineering:
    allowed_models: [claude-opus-5-5, claude-sonnet-5-5]
    tpm_quota: 100000
  marketing:
    allowed_models: [claude-sonnet-5-5]
    tpm_quota: 20000
